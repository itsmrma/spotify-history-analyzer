name: Tests
on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: npm ci
            - run: npm run format:check
            - run: npm test
            - run: python -m unittest discover -s tests -p test_legacy.py -v
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-test-results
                  path: test-results/
                  retention-days: 7
